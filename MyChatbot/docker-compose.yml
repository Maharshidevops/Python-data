version: '3.9'

services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  chatbot:
    build: .
    container_name: rag_chatbot
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    volumes:
      - ./data:/app/data

volumes:
  ollama_data:
